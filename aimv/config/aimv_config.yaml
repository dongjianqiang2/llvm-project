# aimv_config.yaml — default configuration

aimv:
  # iteration control
  max_rounds: 5
  aimv_level: "moderate"           # conservative | moderate | aggressive

  # MCP service
  mcp:
    url: "http://localhost:8080"
    timeout_seconds: 60
    retry_count: 2
    cache_enabled: true
    cache_ttl_hours: 24

  # build
  build:
    cc: "clang"
    cflags: "-O2 -fsave-optimization-record -g -Rpass=loop-vectorize -Rpass-missed=loop-vectorize -Rpass-analysis=loop-vectorize"
    opt_record_format: "yaml"

  # verification
  verify:
    test_cmd: "make test"
    check_vectorization: true      # check if remark changes to passed after recompilation
    measure_perf: false            # requires hardware PMU or timing framework

  # output
  output:
    dir: "./aimv-output"
    keep_sessions: true
    log_level: "info"
