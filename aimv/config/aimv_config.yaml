# aimv_config.yaml — default configuration template
# Priority: env vars > ~/.aimv/config > defaults
# Env vars: AIMV_MCP_URL, AIMV_MCP_API_KEY, AIMV_LEVEL, AIMV_MAX_ROUNDS, AIMV_TEST_CMD, AIMV_MODE

mcp:
  url: "http://localhost:8080"
  api_key: ""
  timeout_seconds: 60
  retry_count: 2
  cache_enabled: true
  cache_ttl_hours: 24

driver:
  max_rounds: 5
  aimv_level: "conservative"     # conservative | moderate | aggressive
  test_cmd: ""                   # empty = compile-only verification
  cc: "clang"
  cflags: "-O2 -g"
  output_dir: "./aimv-output"
