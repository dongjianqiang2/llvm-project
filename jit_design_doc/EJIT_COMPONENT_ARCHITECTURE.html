<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EmbeddedJIT 组件架构图</title>
<style>
  :root{
    --primary:#2c5282; --primary-2:#1a365d; --accent:#3182ce;
    --green:#2f855a; --green-2:#22543d; --teal:#2c7a7b;
    --orange:#c05621; --orange-2:#7b341e;
    --purple:#6b46c1; --purple-2:#553c9a;
    --red:#c53030; --slate:#475569;
    --dark:#1f2937; --gray:#4a5568; --muted:#718096;
    --border:#cbd5e1; --bg:#f7f9fc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--dark);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
    line-height:1.45; font-size:13px;
  }
  .poster{max-width:1500px; margin:0 auto; padding:20px 22px 26px}
  header{
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    color:#fff; border-radius:14px; padding:18px 24px;
    box-shadow:0 10px 26px rgba(44,82,130,.18);
    display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
  }
  header h1{margin:0; font-size:25px; letter-spacing:.5px}
  header .sub{margin:4px 0 0; color:#cfe0f5; font-size:13.5px; max-width:1000px}
  .panel{
    margin-top:14px; background:#fff; border:1px solid var(--border); border-radius:14px;
    box-shadow:0 6px 18px rgba(30,41,59,.06); padding:14px;
  }
  svg{width:100%; height:auto; display:block}
  .legend{display:flex; flex-wrap:wrap; gap:18px; justify-content:center; margin-top:14px; font-size:11.5px; color:var(--muted)}
  .legend span{display:inline-flex; align-items:center; gap:7px}
  .legend i{display:inline-block; width:26px; height:0; border-top:2px solid var(--muted)}
  .legend i.dash{border-top:2px dashed var(--muted)}
  .legend i.thick{border-top:2.4px solid var(--purple)}
</style>
</head>
<body>
<div class="poster">
  <header>

    </div>
  </header>
